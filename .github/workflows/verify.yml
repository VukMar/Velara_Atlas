name: Verify noncanonical Atlas
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run connections
      - run: npm run connections:check
      - run: npm run build
      - run: npm run history:demo
      - run: npm run idfind -- all
      - run: npm run release:check
      - run: git diff --exit-code
      # Rich browser callback suites run through the local MCP harness, not npm test.
      # No deployment, repository write, artifact upload, secrets or performance timing gate.
