- name: Diagnose Windows Vite tests
  if: runner.os == 'Windows'
  timeout-minutes: 10
  shell: pwsh
  run: |
    Write-Host "=== CALIBRATION ==="
    node --test --test-concurrency=1 tests/cantum-calibration.test.mjs
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    Write-Host "=== LOCAL PREVIEW ==="
    node --test --test-concurrency=1 tests/local-preview.test.mjs
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    Write-Host "=== VIEWER ==="
    node --test --test-concurrency=1 tests/viewer.test.mjs
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }